syntax = "proto3";

package apex20.v1;

option go_package = "github.com/apex20/contracts/proto/apex20/v1;apex20v1";

// Role define o nível de acesso de um usuário na plataforma.
// É a fonte única de verdade para roles em todos os serviços.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_GM          = 1;
  ROLE_PLAYER      = 2;
  ROLE_TRUSTED     = 3;
  ROLE_ADMIN       = 4;
}
